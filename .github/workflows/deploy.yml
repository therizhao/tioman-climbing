name: CI · Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Hoisted to job level so the deploy step's `if:` can read them —
# step-level `env` is NOT visible to that same step's `if:` expression.
env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Deploys on push to main once both repo secrets are set.
      # If you connect the repo in the Cloudflare dashboard instead,
      # leave the secrets unset and Cloudflare builds on push — this
      # job then just acts as a build check.
      - name: Publish to Cloudflare Pages
        if: >-
          github.event_name != 'pull_request' &&
          env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name tioman-climbing --branch main
